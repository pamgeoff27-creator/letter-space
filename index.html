
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Anagram Workspace</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:680px;margin:auto;padding:18px 14px 35px}
header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.logo{display:grid;grid-template-columns:repeat(3,12px);gap:2px;padding:10px;border-radius:50%;background:#f5f5f7}
.logo span{width:12px;height:12px;border:2px solid #111;border-radius:2px}
.logo span:nth-child(2),.logo span:nth-child(4),.logo span:nth-child(8){background:#111}
h1{font-size:clamp(21px,5vw,27px);letter-spacing:-.6px;margin:0}
.input{width:100%;border:1px solid #ddd;border-radius:11px;padding:12px;font-size:19px;text-transform:uppercase}
.answer-wrap{overflow-x:auto;padding:0 2px;margin:42px 0 8px}
.answer{display:flex;gap:4px;min-height:46px;width:max-content;min-width:100%;justify-content:center}
.slot{width:clamp(29px,7.2vw,43px);height:44px;flex:0 0 clamp(29px,7.2vw,43px);border:3px solid #3290f4;border-radius:9px;display:grid;place-items:center}
.slot .tile{width:100%;height:100%;font-size:24px}
.workspace{position:relative;background:#f1f1f4;border-radius:23px 23px 18px 18px;margin-top:5px;overflow:hidden}
.play-area{height:155px;position:relative;touch-action:pan-y}
.tile{position:absolute;width:42px;height:42px;border-radius:10px;background:#1685ed;color:white;display:grid;place-items:center;font-size:25px;font-weight:700;user-select:none;touch-action:none;cursor:grab;box-shadow:0 1px 2px #0001}
.tile.dragging{z-index:20;cursor:grabbing;box-shadow:0 6px 15px #0003}
.tile.in-slot{position:relative;left:auto!important;top:auto!important;background:#1685ed}
.resize{height:57px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:#e9e9ed;touch-action:none;cursor:ns-resize;color:#888;font-size:13px;user-select:none}
.handle{width:52px;height:6px;border-radius:8px;background:#c5c5ca}
.dots{letter-spacing:3px;font-size:12px;color:#c5c5ca}
.buttons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:54px}
button{border:0;border-radius:11px;padding:12px 5px;background:#e9e9ed;color:#111;font-size:clamp(13px,3.6vw,18px);font-weight:650;min-height:50px;cursor:pointer}
button:disabled{opacity:.4}
button.primary{background:#1685ed;color:white}
.extra{display:flex;justify-content:center;margin-top:14px}
.extra button{min-width:150px}
.status{text-align:center;color:#777;font-size:13px;min-height:20px;margin-top:18px}
@media(max-width:390px){.app{padding:16px 10px}.tile{width:37px;height:37px}.buttons{gap:5px}.play-area{height:155px}}
</style>
</head>
<body>
<main class="app">
<header>
<div class="logo" aria-hidden="true">
<span></span><span></span><span></span>
<span></span><span></span><span></span>
<span></span><span></span><span></span>
</div>
<h1>Anagram Workspace</h1>
</header>

<form id="entry">
<input id="letters" class="input" placeholder="Enter your letters" value="" autocomplete="off" autocapitalize="characters" aria-label="Enter anagram letters">
</form>

<div class="answer-wrap"><div class="answer" id="answer"></div></div>

<section class="workspace">
<div id="play" class="play-area" aria-label="Free letter workspace"></div>
<div id="resize" class="resize" role="separator" aria-label="Drag to resize workspace">
<div class="handle"></div><div class="dots">••••••</div>
<div>Drag bar to change workspace size</div>
</div>
</section>

<div class="buttons">
<button id="undo" type="button" aria-label="Undo">↶ Undo</button>
<button id="redo" type="button" aria-label="Redo">↷ Redo</button>
<button id="fill" type="button">Fill Boxes</button>
<button id="shuffle" type="button">Shuffle</button>
</div>
<div class="extra"><button id="restart" class="primary" type="button">Restart</button></div>
<div class="extra"><button id="instructions" type="button">Instructions</button></div>
<div id="status" class="status" aria-live="polite">Enter letters above to begin.</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
let letters=[],size=0,nextId=1,history=[],future=[],drag=null;
let areaHeight=155;
const play=$("play"),answer=$("answer");
function say(s){$("status").textContent=s}
function snapshot(){return JSON.stringify({letters,size})}
function save(){history.push(snapshot());if(history.length>80)history.shift();future=[];buttons()}
function buttons(){$("undo").disabled=!history.length;$("redo").disabled=!future.length}
function restore(s){const d=JSON.parse(s);letters=d.letters;size=d.size;render()}
function recordUndo(){if(history.length){future.push(snapshot());restore(history.pop());buttons();say("Undone.")}}
function recordRedo(){if(future.length){history.push(snapshot());restore(future.pop());buttons();say("Redone.")}}
function occupied(i){return letters.find(t=>t.slot===i)}
function render(){
 play.style.height=areaHeight+"px";
 play.replaceChildren();answer.replaceChildren();
 answer.style.justifyContent=size>12?"start":"center";
 answer.style.minWidth=size>12?"max-content":"100%";
 for(let i=0;i<size;i++){
  const slot=document.createElement("div");slot.className="slot";slot.dataset.slot=i;
  const t=occupied(i);
  if(t){const tile=makeTile(t);tile.classList.add("in-slot");slot.appendChild(tile)}
  answer.appendChild(slot);
 }
 letters.filter(t=>t.slot===null).forEach(t=>{
  const tile=makeTile(t);
  tile.style.left=t.x+"px";tile.style.top=t.y+"px";
  play.appendChild(tile);
 });
 buttons();
}
function makeTile(t){
 const el=document.createElement("div");
 el.className="tile";el.textContent=t.ch;el.dataset.id=t.id;
 el.setAttribute("aria-label","Letter "+t.ch);
 el.addEventListener("pointerdown",e=>start(e,t,el));
 return el;
}
function addLetters(value){
 const chars=(value.toUpperCase().match(/[A-Z]/g)||[]);
 if(!chars.length){say("Please enter some letters first.");return}
 save();size=chars.length;
 letters=chars.map((ch,i)=>({id:nextId++,ch,slot:null,x:12+(i%5)*48,y:12+Math.floor(i/5)*49}));
 render();say(size+" letters added. Drag them freely or place them in the boxes.");
}

function start(e,t,el){
 if(e.button!==undefined&&e.button!==0)return;
 e.preventDefault();

 const rect=el.getBoundingClientRect();

 drag={
  t,
  el,
  fromSlot:t.slot,
  startX:e.clientX,
  startY:e.clientY,
  dx:e.clientX-rect.left,
  dy:e.clientY-rect.top,
  moved:false
 };

 el.classList.add("dragging");
 el.style.position="fixed";
 el.style.left=rect.left+"px";
 el.style.top=rect.top+"px";
 el.style.width=rect.width+"px";
 el.style.height=rect.height+"px";
 el.style.zIndex="9999";

 document.body.appendChild(el);

 document.addEventListener("pointermove",move);
 document.addEventListener("pointerup",end);
 document.addEventListener("pointercancel",cancel);
}

function move(e){
 if(!drag)return;
 if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>4)drag.moved=true;
 drag.el.style.left=(e.clientX-drag.dx)+"px";drag.el.style.top=(e.clientY-drag.dy)+"px";
}

function end(e){
 if(!drag)return;

 const d=drag;
 const hit=document.elementFromPoint(e.clientX,e.clientY);
 const slotEl=hit&&hit.closest(".slot");
 const inPlay=hit&&hit.closest("#play");

 if(d.moved){
  save();

  const oldSlot=d.t.slot;

  if(slotEl){
   const index=Number(slotEl.dataset.slot);
   const other=occupied(index);

   if(other&&other.id!==d.t.id){
    other.slot=oldSlot;
   }

   d.t.slot=index;
   say("Letter "+d.t.ch+" placed in box "+(index+1)+".");

  }else if(inPlay){
   const r=play.getBoundingClientRect();

   d.t.slot=null;
   d.t.x=Math.max(0,Math.min(r.width-42,e.clientX-r.left-d.dx));
   d.t.y=Math.max(0,Math.min(r.height-42,e.clientY-r.top-d.dy));

   say("Letter moved in workspace.");

  }else if(d.fromSlot!==null){
   const r=play.getBoundingClientRect();

   d.t.slot=null;
   d.t.x=Math.max(0,Math.min(r.width-42,e.clientX-r.left-21));
   d.t.y=Math.max(0,Math.min(r.height-42,e.clientY-r.top-21));

   say("Letter returned to workspace.");
  }
 }

 cleanup();
 render();
}

function cleanup(){
 if(!drag)return;
 drag=null;
 document.removeEventListener("pointermove",move);
 document.removeEventListener("pointerup",end);
 document.removeEventListener("pointercancel",cancel);
}
function cancel(){cleanup();render()}
$("entry").addEventListener("submit",e=>{e.preventDefault();addLetters($("letters").value)});
$("undo").addEventListener("click",recordUndo);
$("redo").addEventListener("click",recordRedo);
$("fill").addEventListener("click",()=>{
 if(!letters.length)return;
 save();let n=0;
 for(let i=0;i<size;i++){const t=occupied(i);if(!t){const next=letters.find(x=>x.slot===null);if(next){next.slot=i;n++}}}
 render();say(n?"Filled "+n+" empty box(es).":"All boxes are already filled.");
});
$("shuffle").addEventListener("click",()=>{
 const free=letters.filter(t=>t.slot===null);
 if(free.length<2){say("At least two free letters are needed to shuffle.");return}
 save();const r=play.getBoundingClientRect();
 free.forEach(t=>{t.x=Math.random()*Math.max(1,r.width-44);t.y=Math.random()*Math.max(1,r.height-44)});
 render();say("Free letters shuffled.");
});
$("restart").addEventListener("click",()=>{
 save();letters=[];size=0;$("letters").value="";render();say("Ready for a new anagram.");
});
$("instructions").addEventListener("click",()=>say("Drag blue tiles anywhere in the grey area. Drag tiles to answer boxes to place them. Drag a placed tile back into the grey area to remove it. Use the bar to resize the workspace."));
let resizing=false,startY=0,startHeight=0;
$("resize").addEventListener("pointerdown",e=>{resizing=true;startY=e.clientY;startHeight=areaHeight;$("resize").setPointerCapture(e.pointerId)});
$("resize").addEventListener("pointermove",e=>{if(!resizing)return;areaHeight=Math.max(90,Math.min(500,startHeight+e.clientY-startY));play.style.height=areaHeight+"px";render()});
$("resize").addEventListener("pointerup",()=>resizing=false);
$("resize").addEventListener("pointercancel",()=>resizing=false);
buttons();
})();
</script>
</body>
</html>
