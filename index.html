
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anagram Workspace</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px;
    background: #fff;
    color: #252b35;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .app {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

 
.logo {
    width: 46px;
    height: 46px;
    display: block;
    object-fit: contain;
    border-radius: 12px;
    flex-shrink: 0;
  }

  h1 {
    margin: 0;
    font-size: clamp(23px, 5vw, 32px);
    letter-spacing: -0.8px;
  }

  .entry-row {
    display: flex;
    gap: 9px;
    margin-bottom: 22px;
  }

  input {
    flex: 1;
    min-width: 0;
    padding: 13px 14px;
    border: 1px solid #cbd2dc;
    border-radius: 9px;
    font-size: 17px;
  }

  button {
    padding: 11px 15px;
    border: 1px solid #d3d9e2;
    border-radius: 9px;
    background: white;
    color: #283241;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover { background: #f1f5fb; }
  button:disabled { opacity: .4; cursor: default; }

  .primary {
    border-color: #3679e8;
    background: #3679e8;
    color: white;
  }

  .primary:hover { background: #2867cf; }

  .section-label {
    margin: 0 0 9px;
    font-size: 14px;
    font-weight: 700;
    color: #5c6675;
  }

  .answer-scroll {
    overflow-x: auto;
    padding: 2px 1px 12px;
    margin-bottom: 14px;
  }

  #answer {
    display: flex;
    gap: 5px;
    min-height: 48px;
    width: max-content;
  }

  .slot {
    width: 39px;
    height: 43px;
    flex: 0 0 39px;
    display: grid;
    place-items: center;
    border: 2px solid #83afea;
    border-radius: 6px;
    background: #fff;
  }

  .slot.over {
    background: #e4efff;
    border-color: #2468d8;
  }

  #play-area {
    position: relative;
    width: 100%;
    height: 250px;
    overflow: hidden;
    border: 1px solid #e1e5eb;
    border-radius: 10px;
    background: #f2f4f7;
    touch-action: pan-y;
  }

  .tile {
    position: absolute;
    width: 40px;
    height: 42px;
    display: grid;
    place-items: center;
    border: 1px solid #2e70d8;
    border-radius: 6px;
    background: #397fe8;
    color: white;
    font-size: 21px;
    font-weight: 700;
    box-shadow: 0 2px 3px #172b461c;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    z-index: 1;
  }

  .slot .tile {
    position: relative;
    inset: auto;
    width: 35px;
    height: 37px;
    box-shadow: none;
  }

  .tile:active { cursor: grabbing; }

  .workspace-frame { position: relative; }

  #resize {
    width: 52px;
    height: 13px;
    margin: 0 auto 18px;
    border-bottom: 3px solid #cbd2dc;
    border-radius: 0 0 8px 8px;
    cursor: ns-resize;
    touch-action: none;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 5px;
  }

  #status {
    min-height: 24px;
    margin-top: 13px;
    color: #626d7c;
    font-size: 14px;
  }

  .hint {
    margin-top: 10px;
    color: #6d7785;
    font-size: 13px;
    line-height: 1.5;
  }

  #ghost {
    position: fixed;
    z-index: 99999;
    pointer-events: none;
    opacity: .95;
    transform: translate(-50%, -50%);
  }

  @media (max-width: 480px) {
    body { padding: 14px; }
    .entry-row button { padding: 10px 12px; }
    .slot { width: 34px; flex-basis: 34px; }
    .controls button { padding: 10px 11px; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="logo" aria-hidden="true">A</div>
    <h1>Anagram Workspace</h1>
  </header>

  <form id="entry-form" class="entry-row">
    <input id="entry" type="text" placeholder="Enter a word, e.g. GOLDILOCKS"
      aria-label="Word to rearrange" autocomplete="off" spellcheck="false">
    <button class="primary" type="submit">Create</button>
  </form>

  <p class="section-label">ANSWER</p>
  <div class="answer-scroll">
    <div id="answer" aria-label="Answer boxes"></div>
  </div>

  <p class="section-label">LETTER WORKSPACE</p>
  <div class="workspace-frame">
    <div id="play-area" aria-label="Letter workspace"></div>
    <div id="resize" title="Drag to resize workspace" aria-label="Resize workspace"></div>
  </div>

  <div class="controls">
    <button id="undo" type="button" disabled>↶ Undo</button>
    <button id="redo" type="button" disabled>↷ Redo</button>
    <button id="fill" type="button">Fill Boxes</button>
    <button id="shuffle" type="button">Shuffle</button>
    <button id="restart" type="button">Restart</button>
    <button id="instructions" type="button">Instructions</button>
  </div>

  <div id="status" role="status">Enter a word above to get started.</div>
  <p class="hint">Drag letters freely around the workspace. Drop a letter into an answer box when you're ready. Drag it back down to return it to the workspace.</p>
</main>

<script>
(() => {
  const entry = document.getElementById("entry");
  const form = document.getElementById("entry-form");
  const answer = document.getElementById("answer");
  const play = document.getElementById("play-area");
  const resize = document.getElementById("resize");
  const status = document.getElementById("status");
  const undoButton = document.getElementById("undo");
  const redoButton = document.getElementById("redo");

  let tiles = [];
  let nextId = 1;
  let history = [];
  let future = [];
  let areaHeight = 250;
  let activeDrag = null;

  const copy = value => JSON.parse(JSON.stringify(value));

  function snapshot() {
    return { tiles: copy(tiles), areaHeight };
  }

  function saveHistory() {
    history.push(snapshot());
    if (history.length > 100) history.shift();
    future = [];
    updateHistoryButtons();
  }

  function updateHistoryButtons() {
    undoButton.disabled = history.length === 0;
    redoButton.disabled = future.length === 0;
  }

  function restore(state) {
    tiles = copy(state.tiles);
    areaHeight = state.areaHeight;
    play.style.height = areaHeight + "px";
    render();
    updateHistoryButtons();
  }

  function say(message) {
    status.textContent = message;
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function freePosition(index) {
    const cols = Math.max(1, Math.floor((play.clientWidth - 12) / 48));
    return {
      x: 8 + (index % cols) * 47,
      y: 8 + Math.floor(index / cols) * 48
    };
  }

  function render() {
    answer.replaceChildren();
    play.replaceChildren();
    play.style.height = areaHeight + "px";

    if (tiles.length === 0) {
      say("Enter a word above to get started.");
    }

    const count = tiles.length;

    for (let i = 0; i < count; i++) {
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.dataset.slot = String(i);
      slot.setAttribute("aria-label", "Answer box " + (i + 1));
      answer.appendChild(slot);
    }

    for (const tile of tiles) {
      const el = document.createElement("div");
      el.className = "tile";
      el.textContent = tile.letter;
      el.dataset.id = String(tile.id);
      el.setAttribute("role", "button");
      el.setAttribute("aria-label", "Letter " + tile.letter + ". Drag to move.");
      el.addEventListener("pointerdown", event => startDrag(event, tile.id));

      if (tile.slot !== null) {
        const slot = answer.children[tile.slot];
        if (slot) slot.appendChild(el);
      } else {
        el.style.left = clamp(tile.x, 0, Math.max(0, play.clientWidth - 40)) + "px";
        el.style.top = clamp(tile.y, 0, Math.max(0, areaHeight - 42)) + "px";
        play.appendChild(el);
      }
    }

    updateHistoryButtons();
  }

  function createWord(word) {
    const letters = word.toUpperCase().replace(/[^A-Z]/g, "");
    if (!letters) {
      say("Please enter a word using letters A–Z.");
      return;
    }

    saveHistory();
    nextId = 1;
    tiles = Array.from(letters, (letter, i) => {
      const pos = freePosition(i);
      return {
        id: nextId++,
        letter,
        slot: null,
        x: pos.x,
        y: pos.y
      };
    });

    render();
    say("Created " + tiles.length + " letter tiles.");
  }

  function startDrag(event, id) {
    if (event.button !== undefined && event.button !== 0) return;
    if (activeDrag) return;

    const tile = tiles.find(item => item.id === id);
    if (!tile) return;

    event.preventDefault();

    const source = event.currentTarget;
    const rect = source.getBoundingClientRect();
    const ghost = source.cloneNode(true);
    ghost.id = "ghost";
    ghost.style.left = event.clientX + "px";
    ghost.style.top = event.clientY + "px";
    ghost.style.width = rect.width + "px";
    ghost.style.height = rect.height + "px";
    document.body.appendChild(ghost);
    source.style.visibility = "hidden";

    activeDrag = {
      id,
      oldSlot: tile.slot,
      oldX: tile.x,
      oldY: tile.y,
      source,
      ghost,
      startX: event.clientX,
      startY: event.clientY
    };

    document.addEventListener("pointermove", moveDrag);
    document.addEventListener("pointerup", finishDrag);
    document.addEventListener("pointercancel", cancelDrag);
  }

  function moveDrag(event) {
    if (!activeDrag) return;
    activeDrag.ghost.style.left = event.clientX + "px";
    activeDrag.ghost.style.top = event.clientY + "px";

    document.querySelectorAll(".slot.over").forEach(el => el.classList.remove("over"));
    const target = document.elementFromPoint(event.clientX, event.clientY);
    const slot = target && target.closest(".slot");
    if (slot) slot.classList.add("over");
  }

  function removeDragListeners() {
    document.removeEventListener("pointermove", moveDrag);
    document.removeEventListener("pointerup", finishDrag);
    document.removeEventListener("pointercancel", cancelDrag);
  }

  function clearDragVisuals() {
    if (!activeDrag) return;
    activeDrag.ghost.remove();
    activeDrag = null;
    removeDragListeners();
  }

  function cancelDrag() {
    if (!activeDrag) return;
    clearDragVisuals();
    render();
  }

  function finishDrag(event) {
    if (!activeDrag) return;

    const drag = activeDrag;
    const target = document.elementFromPoint(event.clientX, event.clientY);
    const slotEl = target && target.closest(".slot");
    const inPlay = target && (target === play || play.contains(target));
    const tile = tiles.find(item => item.id === drag.id);

    if (tile) {
      let destinationSlot = null;

      if (slotEl && answer.contains(slotEl)) {
        destinationSlot = Number(slotEl.dataset.slot);
      }

      const playRect = play.getBoundingClientRect();
      const droppedInPlay =
        event.clientX >= playRect.left &&
        event.clientX <= playRect.right &&
        event.clientY >= playRect.top &&
        event.clientY <= playRect.bottom;

      if (destinationSlot !== null && Number.isInteger(destinationSlot)) {
        saveHistory();

        const occupant = tiles.find(item =>
          item.id !== tile.id && item.slot === destinationSlot
        );

        if (occupant) {
          if (drag.oldSlot !== null) {
            occupant.slot = drag.oldSlot;
          } else {
            occupant.slot = null;
            occupant.x = drag.oldX;
            occupant.y = drag.oldY;
          }
        }

        tile.slot = destinationSlot;
        say("Letter " + tile.letter + " placed in box " + (destinationSlot + 1) + ".");
      } else if (droppedInPlay || inPlay) {
        saveHistory();
        tile.slot = null;
        tile.x = clamp(event.clientX - playRect.left - 20, 0, Math.max(0, play.clientWidth - 40));
        tile.y = clamp(event.clientY - playRect.top - 21, 0, Math.max(0, areaHeight - 42));
        say("Letter " + tile.letter + " returned to the workspace.");
      } else {
        say("Tile kept in its previous position.");
      }
    }

    clearDragVisuals();
    render();
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    createWord(entry.value);
  });

  undoButton.addEventListener("click", () => {
    if (!history.length) return;
    future.push(snapshot());
    restore(history.pop());
    say("Undone.");
  });

  redoButton.addEventListener("click", () => {
    if (!future.length) return;
    history.push(snapshot());
    restore(future.pop());
    say("Redone.");
  });

  document.getElementById("fill").addEventListener("click", () => {
    if (!tiles.length) {
      say("Enter a word first.");
      return;
    }

    const freeTiles = tiles.filter(tile => tile.slot === null);
    if (!freeTiles.length) {
      say("All letters are already in answer boxes.");
      return;
    }

    saveHistory();
    const occupied = new Set(tiles.filter(tile => tile.slot !== null).map(tile => tile.slot));
    let nextSlot = 0;

    for (const tile of freeTiles) {
      while (occupied.has(nextSlot)) nextSlot++;
      tile.slot = nextSlot;
      occupied.add(nextSlot);
      nextSlot++;
    }

    render();
    say("Filled the empty answer boxes.");
  });

  document.getElementById("shuffle").addEventListener("click", () => {
    const freeTiles = tiles.filter(tile => tile.slot === null);
    if (freeTiles.length < 2) {
      say("You need at least two tiles in the workspace to shuffle.");
      return;
    }

    saveHistory();
    const positions = freeTiles.map((tile, i) => freePosition(i)).sort(() => Math.random() - 0.5);
    freeTiles.forEach((tile, i) => {
      tile.x = positions[i].x;
      tile.y = positions[i].y;
    });

    render();
    say("Workspace letters shuffled.");
  });

  document.getElementById("restart").addEventListener("click", () => {
    if (!tiles.length) {
      say("Enter a word first.");
      return;
    }

    saveHistory();
    tiles.forEach((tile, i) => {
      tile.slot = null;
      const pos = freePosition(i);
      tile.x = pos.x;
      tile.y = pos.y;
    });
    render();
    say("All letters returned to the workspace.");
  });

  document.getElementById("instructions").addEventListener("click", () => {
    say("Enter a word and press Create. Drag blue letters into the answer boxes, or move them freely in the workspace. Drag a placed letter back down to remove it. Undo and Redo reverse your changes.");
  });

  let resizeStart = null;

  resize.addEventListener("pointerdown", event => {
    event.preventDefault();
    resizeStart = { y: event.clientY, height: areaHeight };
    resize.setPointerCapture(event.pointerId);
  });

  resize.addEventListener("pointermove", event => {
    if (!resizeStart) return;
    areaHeight = clamp(resizeStart.height + event.clientY - resizeStart.y, 150, 650);
    play.style.height = areaHeight + "px";
  });

  function endResize() {
    if (!resizeStart) return;
    resizeStart = null;
    render();
  }

  resize.addEventListener("pointerup", endResize);
  resize.addEventListener("pointercancel", endResize);

  render();
})();
</script>
</body>
</html>
