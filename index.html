
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#acd1ff">
<title>Letter Space</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#acd1ff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:650px;min-height:100vh;margin:auto;padding:20px 14px 35px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 3px 20px}
h1{font-size:27px;letter-spacing:-1px;margin:0}
button,input,select{font:inherit}
button{cursor:pointer}
.panel{background:#fff;border-radius:18px;padding:19px;margin-bottom:14px;box-shadow:0 6px 18px #385b8515}
.label{display:block;font-size:12px;font-weight:800;letter-spacing:1px;margin-bottom:9px;color:#555}
.entry{display:flex;gap:8px}
input{min-width:0;width:100%;border:2px solid #ddd;border-radius:11px;padding:12px;font-size:17px}
.btn{border:0;border-radius:11px;padding:12px 16px;background:#111;color:white;font-weight:700}
.light{background:#eee;color:#111}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 12px}
select{padding:8px;border:1px solid #ddd;border-radius:9px;background:white}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.slot{min-width:0;aspect-ratio:.9;border:3px solid #111;border-radius:10px;background:white;display:grid;place-items:center}
.slot.filled{background:#f2cafa}
.slot.over,.tray.over{background:#deebff!important;border-color:#4387db!important}
.tile{width:100%;height:100%;display:grid;place-items:center;font-family:Georgia,serif;font-style:italic;font-weight:bold;font-size:clamp(25px,8vw,43px);touch-action:none;user-select:none;cursor:grab}
.tray{display:flex;flex-wrap:wrap;gap:9px;min-height:80px;padding:10px;border:2px dashed #ccc;border-radius:12px;background:#fafafa}
.tray-tile{width:48px;height:48px;flex:0 0 48px;border:3px solid #111;border-radius:10px;background:white}
.tray-tile .tile{font-size:32px}
.status{font-size:13px;color:#555;min-height:18px;margin-top:12px}
.count{font-size:12px;color:#555;margin-top:10px}
.ghost{position:fixed;z-index:99999;width:54px;height:54px;display:grid;place-items:center;border:3px solid #111;border-radius:11px;background:#f2cafa;font:bold italic 37px Georgia,serif;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg);box-shadow:0 8px 20px #0003}
.hint{font-size:12px;color:#555;margin:0 0 12px}
@media(min-width:500px){.app{padding-top:28px}.panel{padding:25px}.slot{aspect-ratio:1.1}}
</style>
</head>
<body>
<main class="app">
<header>
<h1>Letter Space</h1>
<button class="btn light" id="reset">Reset</button>
</header>

<section class="panel">
<label class="label" for="letters">TYPE YOUR LETTERS</label>
<form class="entry" id="form">
<input id="letters" placeholder="e.g. THERIP" autocomplete="off" autocapitalize="characters">
<button class="btn" type="submit">Add</button>
</form>

<div class="row">
<strong>Answer grid</strong>
<select id="length" aria-label="Answer length">
<option>3</option><option>4</option><option>5</option>
<option selected>6</option><option>7</option><option>8</option>
<option>9</option><option>10</option><option>12</option>
</select>
</div>

<div id="grid" class="grid"></div>
<div id="count" class="count">0 of 6 placed</div>
<button id="clear" class="btn light" style="width:100%;margin-top:14px">Clear grid</button>
<div id="status" class="status" aria-live="polite">Type letters, then drag them into the grid.</div>
</section>

<section class="panel">
<div class="row" style="margin-top:0">
<strong style="font-size:19px">Letter tray</strong>
<span style="font-size:12px;color:#666">Drag to move</span>
</div>
<p class="hint">Hold a letter and drag it into a square. Drag it back here to return it.</p>
<div id="tray" class="tray"></div>
</section>
</main>

<script>
(()=>{
const $=id=>document.getElementById(id);
let size=6,nextId=1,tiles=[],drag=null;
function say(s){$("status").textContent=s}
function at(i){return tiles.find(t=>t.slot===i)}
function render(){
 $("grid").style.gridTemplateColumns=`repeat(${size},minmax(0,1fr))`;
 $("grid").replaceChildren();
 for(let i=0;i<size;i++){
  const s=document.createElement("div");
  s.className="slot";s.dataset.slot=i;
  const t=at(i);
  if(t){s.classList.add("filled");s.appendChild(makeTile(t))}
  $("grid").appendChild(s);
 }
 $("tray").replaceChildren();
 const free=tiles.filter(t=>t.slot===null);
 if(!free.length){
  const msg=document.createElement("span");
  msg.className="hint";msg.textContent="Drag a letter here to return it.";
  $("tray").appendChild(msg);
 }else{
  free.forEach(t=>{
   const box=document.createElement("div");
   box.className="tray-tile";box.appendChild(makeTile(t));
   $("tray").appendChild(box);
  });
 }
 $("count").textContent=tiles.filter(t=>t.slot!==null).length+" of "+size+" placed";
}
function makeTile(t){
 const el=document.createElement("div");
 el.className="tile";el.textContent=t.ch;
 el.setAttribute("aria-label","Letter "+t.ch);
 el.addEventListener("pointerdown",e=>startDrag(e,t,el));
 return el;
}
function addLetters(text){
 const chars=text.toUpperCase().match(/[A-Z]/g)||[];
 if(!chars.length){say("Please type some letters first.");return}
 chars.forEach(ch=>tiles.push({id:nextId++,ch,slot:null}));
 $("letters").value="";
 render();say(chars.length+" letter(s) added.");
}
function startDrag(e,t,el){
 if(e.button!==undefined&&e.button!==0)return;
 e.preventDefault();
 const ghost=document.createElement("div");
 ghost.className="ghost";ghost.textContent=t.ch;
 document.body.appendChild(ghost);
 drag={t,el,ghost,x:e.clientX,y:e.clientY,moved:false};
 el.style.opacity=".25";moveGhost(e.clientX,e.clientY);
 document.addEventListener("pointermove",onMove);
 document.addEventListener("pointerup",onUp);
 document.addEventListener("pointercancel",onCancel);
}
function moveGhost(x,y){
 if(!drag)return;
 drag.ghost.style.left=x+"px";
 drag.ghost.style.top=y+"px";
}
function onMove(e){
 if(!drag)return;
 if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>5)drag.moved=true;
 moveGhost(e.clientX,e.clientY);
 document.querySelectorAll(".slot.over,.tray.over")
  .forEach(el=>el.classList.remove("over"));
 const target=document.elementFromPoint(e.clientX,e.clientY);
 const slot=target&&target.closest("#grid .slot");
 const tray=target&&target.closest("#tray");
 if(slot)slot.classList.add("over");
 else if(tray)tray.classList.add("over");
}
function onUp(e){
 if(!drag)return;
 const d=drag;
 const target=document.elementFromPoint(e.clientX,e.clientY);
 const slot=target&&target.closest("#grid .slot");
 const tray=target&&target.closest("#tray");
 if(d.moved&&(slot||tray)){
  if(slot){
   const index=Number(slot.dataset.slot);
   const occupant=at(index);
   if(occupant&&occupant.id!==d.t.id){
    occupant.slot=d.t.slot;
   }
   d.t.slot=index;
   say("Letter "+d.t.ch+" placed in square "+(index+1)+".");
  }else{
   d.t.slot=null;say("Letter returned to the tray.");
  }
  render();
 }else{
  d.el.style.opacity="";
 }
 finish();
}
function onCancel(){finish()}
function finish(){
 if(!drag)return;
 drag.ghost.remove();drag=null;
 document.removeEventListener("pointermove",onMove);
 document.removeEventListener("pointerup",onUp);
 document.removeEventListener("pointercancel",onCancel);
 document.querySelectorAll(".slot.over,.tray.over")
  .forEach(el=>el.classList.remove("over"));
}
$("form").addEventListener("submit",e=>{
 e.preventDefault();addLetters($("letters").value);
});
$("length").addEventListener("change",()=>{
 size=Number($("length").value);
 tiles.forEach(t=>{if(t.slot!==null&&t.slot>=size)t.slot=null});
 render();say("Grid resized. Extra letters returned to the tray.");
});
$("clear").addEventListener("click",()=>{
 tiles.forEach(t=>t.slot=null);
 render();say("All letters returned to the tray.");
});
$("reset").addEventListener("click",()=>{
 tiles=[];nextId=1;$("letters").value="";
 render();say("Ready for a new puzzle.");
});
render();
})();
</script>
</body>
</html>
